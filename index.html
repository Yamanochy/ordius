<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ordius — смены, техника и зарплата водителей</title>
  <meta name="description" content="Ordius — учёт смен, техники, ремонтов и зарплаты водителей для автопарков и владельцев спецтехники." />
  <link rel="icon" href="demo/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@700&family=Onest:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #F3F4F6; --ink: #14171C; --muted: #555D6B; --signal: #2F6BFF; --graphite: #1C2129; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0E1115; --ink: #ECEEF2; --muted: #A7AEBA; --signal: #5B8CFF; } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink); font-family: "Onest", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 560px; display: flex; flex-direction: column; gap: 20px; }
    h1 { font-family: "Geologica", sans-serif; font-size: 40px; line-height: 44px; margin: 0; letter-spacing: -0.02em; }
    p { color: var(--muted); font-size: 17px; line-height: 26px; margin: 0; }
    a.btn { align-self: flex-start; background: var(--signal); color: #fff; text-decoration: none; font-weight: 600; padding: 14px 22px; border-radius: 10px; }
  </style>
</head>
<body>
  <main>
    <img src="demo/favicon.svg" width="56" height="56" alt="Ordius" />
    <h1>Смены, техника и зарплата водителей — в одном месте</h1>
    <p>Ordius для автопарков и владельцев спецтехники: табель со смартфона водителя, ремонты от заявки до приёмки, расчёт зарплаты и маржа по каждому объекту. Сайт скоро появится — а демо уже работает.</p>
    <a class="btn" href="demo/">Открыть демо</a>
  </main>
</body>
</html>
