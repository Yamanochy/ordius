<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Ordius</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f6f8; --fg: #14161a; --muted: #5b6270; --accent: #2F6BFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --fg: #eef0f4; --muted: #9aa3b2; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 28px; letter-spacing: .12em; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>ORDIUS</h1>
  <p>Рабочая версия готовится к запуску 1 декабря 2026 года.</p>
  <p><a href="https://ordius.ru">ordius.ru</a></p>
</main>
</body>
</html>
